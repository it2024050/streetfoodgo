# Ρυθμίσεις Σύνδεσης με MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/streetfoodgo?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Εντολή στο Spring να φτιάχνει/ενημερώνει τους πίνακες αυτόματα βάσει των Models
spring.jpa.hibernate.ddl-auto=update

# Εμφάνιση των SQL ερωτημάτων στο τερματικό (βοηθάει στο debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
